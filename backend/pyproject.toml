[project]
name = "knowledgeguard-backend"
version = "0.1.0"
description = "KnowledgeGuard backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "arq>=0.28.0",
    "pgvector>=0.5.0",
    "bcrypt>=5.0.0",
    "minio>=7.0.0",
    "python-multipart>=0.0.7",
    "greenlet>=3.5.6",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "openai>=1.0.0",
    "pytesseract>=0.3.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["alembic/versions/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
exclude = ["app/**/test_*.py"]
